    <script>
      (function() {
        try {
          var originalFetch = window.fetch;
          var currentFetch = originalFetch ? originalFetch.bind(window) : undefined;
          
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() {
              return currentFetch;
            },
            set: function(newFetch) {
              currentFetch = newFetch;
            }
          });
        } catch (e) {
          try {
            if (typeof Window !== 'undefined' && Window.prototype) {
              var protoFetch = Window.prototype.fetch;
              var currentProtoFetch = protoFetch;
              Object.defineProperty(Window.prototype, 'fetch', {
                configurable: true,
                enumerable: true,
                get: function() {
                  return currentProtoFetch;
                },
                set: function(newFetch) {
                  currentProtoFetch = newFetch;
                }
              });
            }
          } catch (e2) {}
        }

        window.addEventListener('error', function(event) {
          if (
            (event && event.filename && event.filename.indexOf('chrome-extension://') !== -1) ||
            (event && event.message && event.message.indexOf('chrome-extension://') !== -1)
          ) {
            if (event.preventDefault) event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event && event.reason;
          var str = (reason && (reason.stack || reason.message || String(reason))) || '';
          if (str.indexOf('chrome-extension://') !== -1) {
            if (event.preventDefault) event.preventDefault();
            return true;
          }
        });
      })();
    </script>
